<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>">
  <title>🪙 Allowance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: #2e2e2e;
      --ana: #f0c14b;
      --emma: #6ee7b7;
      --text: #f5f5f5;
      --muted: #888;
      --danger: #f87171;
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      max-width: 420px;
      margin: 0 auto;
    }

    header {
      width: 100%;
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.5px;
      font-family: 'Nunito', sans-serif;
    }

    header .subtitle {
      font-size: 13px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      margin-top: 4px;
    }

    /* Saldos */
    .saldos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-bottom: 28px;
    }

    .saldo-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px 16px;
      text-align: center;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .saldo-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }

    .saldo-card.ana::before { background: var(--ana); }
    .saldo-card.emma::before { background: var(--emma); }

    .saldo-card .nombre {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .saldo-card.ana .nombre { color: var(--ana); }
    .saldo-card.emma .nombre { color: var(--emma); }

    .saldo-card .monto {
      font-family: 'DM Mono', monospace;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -1px;
    }

    .saldo-card .monto.cargando {
      color: var(--muted);
      font-size: 18px;
    }

    /* Secciones */
    .seccion {
      width: 100%;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .seccion-header {
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .seccion-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Botón grande allowance */
    .btn-allowance {
      width: 100%;
      padding: 22px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: background 0.15s, transform 0.1s;
      text-align: center;
    }

    .btn-allowance:active { transform: scale(0.97); }

    .btn-allowance .etiqueta {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .btn-allowance.ambas .etiqueta { color: var(--muted); }
    .btn-allowance.solo-ana .etiqueta { color: var(--ana); }
    .btn-allowance.solo-emma .etiqueta { color: var(--emma); }

    .btn-allowance .monto-label {
      font-family: 'DM Mono', monospace;
      font-size: 22px;
    }

    .btn-allowance.ambas:hover, .btn-allowance.ambas:focus { background: #2a2a1a; border-color: #555533; }
    .btn-allowance.solo-ana:hover, .btn-allowance.solo-ana:focus { background: #2a2510; border-color: var(--ana); }
    .btn-allowance.solo-emma:hover, .btn-allowance.solo-emma:focus { background: #0f2a22; border-color: var(--emma); }

    /* Formulario gasto */
    .campo-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      display: block;
    }

    .campo-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      padding: 16px;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }

    .campo-input:focus { border-color: #555; }

    .campo-input::placeholder { color: var(--muted); }

    /* Selector de hija */
    .hija-selector {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .hija-btn {
      padding: 14px 8px;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }

    .hija-btn:active { transform: scale(0.95); }

    .hija-btn.selected-ana { border-color: var(--ana); color: var(--ana); background: #2a2510; }
    .hija-btn.selected-emma { border-color: var(--emma); color: var(--emma); background: #0f2a22; }
    .hija-btn.selected-ambas { border-color: #aaa; color: var(--text); background: var(--surface2); }

    /* Botón enviar */
    .btn-enviar {
      width: 100%;
      padding: 20px;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn-enviar:active { transform: scale(0.97); }
    .btn-enviar:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 24px;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      max-width: 320px;
      width: 90%;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.ok { border-color: var(--emma); }
    .toast.error { border-color: var(--danger); }

    .toast .nuevos-saldos {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
      font-family: 'DM Mono', monospace;
    }

    .toast .saldo-ana { color: var(--ana); }
    .toast .saldo-emma { color: var(--emma); }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid #444;
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Allowance</h1>
    <div class="subtitle">Ana & Emma</div>
  </header>

  <!-- Saldos -->
  <div class="saldos">
    <div class="saldo-card ana">
      <div class="nombre">Ana</div>
      <div class="monto cargando" id="saldo-ana">...</div>
    </div>
    <div class="saldo-card emma">
      <div class="nombre">Emma</div>
      <div class="monto cargando" id="saldo-emma">...</div>
    </div>
  </div>

  <!-- Allowance -->
  <div class="seccion">
    <div class="seccion-header">Allowance dominical</div>
    <div class="seccion-body">
      <button class="btn-allowance ambas" onclick="registrarAllowance('ambas')">
        <span class="etiqueta">Domingo — Ambas</span>
        <span class="monto-label">+$200 c/u</span>
      </button>
    </div>
  </div>

  <!-- Gasto -->
  <div class="seccion">
    <div class="seccion-header">Registrar gasto</div>
    <div class="seccion-body">
      <div>
        <label class="campo-label">Concepto</label>
        <input class="campo-input" type="text" id="concepto" placeholder="Ej. Miniso" autocomplete="off" autocorrect="off">
      </div>
      <div>
        <label class="campo-label">Monto ($)</label>
        <input class="campo-input" type="number" id="monto" placeholder="150" inputmode="numeric">
      </div>
      <div>
        <label class="campo-label">¿A quién?</label>
        <div class="hija-selector">
          <button class="hija-btn" id="btn-ana" onclick="seleccionarHija('ana')">Ana</button>
          <button class="hija-btn" id="btn-emma" onclick="seleccionarHija('emma')">Emma</button>
          <button class="hija-btn" id="btn-ambas" onclick="seleccionarHija('ambas')">Ambas</button>
        </div>
      </div>
      <button class="btn-enviar" id="btn-registrar" onclick="registrarGasto()">Registrar gasto</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxImJsNdHX13v2u8_sp27_nd5ffTqN9ciloLfvROLKX_PAsOu7ubPXmZj7zGptKbCo/exec';

    let hijaSeleccionada = null;

    // Cargar saldos al inicio
    async function cargarSaldos() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        document.getElementById('saldo-ana').textContent = data.saldo_ana;
        document.getElementById('saldo-ana').classList.remove('cargando');
        document.getElementById('saldo-emma').textContent = data.saldo_emma;
        document.getElementById('saldo-emma').classList.remove('cargando');
      } catch (e) {
        document.getElementById('saldo-ana').textContent = '–';
        document.getElementById('saldo-emma').textContent = '–';
      }
    }

    function fechaHoy() {
      const d = new Date();
      const meses = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${d.getDate()}-${meses[d.getMonth()]}-${String(d.getFullYear()).slice(2)}`;
    }

    async function enviar(payload) {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    function mostrarToast(msg, tipo, saldos) {
      const t = document.getElementById('toast');
      t.className = `toast ${tipo}`;
      let html = msg;
      if (saldos) {
        html += `<div class="nuevos-saldos">
          <span class="saldo-ana">Ana ${saldos.saldo_ana}</span>
          <span class="saldo-emma">Emma ${saldos.saldo_emma}</span>
        </div>`;
      }
      t.innerHTML = html;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    function actualizarSaldosUI(data) {
      if (data.saldo_ana) {
        document.getElementById('saldo-ana').textContent = data.saldo_ana;
        document.getElementById('saldo-ana').classList.remove('cargando');
      }
      if (data.saldo_emma) {
        document.getElementById('saldo-emma').textContent = data.saldo_emma;
        document.getElementById('saldo-emma').classList.remove('cargando');
      }
    }

    async function registrarAllowance(quien) {
      const fecha = fechaHoy();
      const payload = {
        fecha,
        concepto: 'Allowance',
        ana: (quien === 'ana' || quien === 'ambas') ? 200 : null,
        emma: (quien === 'emma' || quien === 'ambas') ? 200 : null
      };
      try {
        const data = await enviar(payload);
        if (data.ok) {
          actualizarSaldosUI(data);
          mostrarToast('✅ Allowance registrado', 'ok', data);
        }
      } catch (e) {
        mostrarToast('❌ Error al conectar', 'error');
      }
    }

    function seleccionarHija(hija) {
      hijaSeleccionada = hija;
      document.getElementById('btn-ana').className = 'hija-btn' + (hija === 'ana' ? ' selected-ana' : '');
      document.getElementById('btn-emma').className = 'hija-btn' + (hija === 'emma' ? ' selected-emma' : '');
      document.getElementById('btn-ambas').className = 'hija-btn' + (hija === 'ambas' ? ' selected-ambas' : '');
    }

    async function registrarGasto() {
      const concepto = document.getElementById('concepto').value.trim();
      const monto = parseFloat(document.getElementById('monto').value);

      if (!concepto) { mostrarToast('Falta el concepto', 'error'); return; }
      if (!monto || monto <= 0) { mostrarToast('Falta el monto', 'error'); return; }
      if (!hijaSeleccionada) { mostrarToast('Selecciona a quién', 'error'); return; }

      const payload = {
        fecha: fechaHoy(),
        concepto,
        ana: (hijaSeleccionada === 'ana' || hijaSeleccionada === 'ambas') ? -monto : null,
        emma: (hijaSeleccionada === 'emma' || hijaSeleccionada === 'ambas') ? -monto : null
      };

      const btn = document.getElementById('btn-registrar');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Registrando...';

      try {
        const data = await enviar(payload);
        if (data.ok) {
          actualizarSaldosUI(data);
          mostrarToast(`✅ ${concepto} registrado`, 'ok', data);
          document.getElementById('concepto').value = '';
          document.getElementById('monto').value = '';
          hijaSeleccionada = null;
          seleccionarHija(null);
        }
      } catch (e) {
        mostrarToast('❌ Error al conectar', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Registrar gasto';
      }
    }

    cargarSaldos();
  </script>
</body>
</html>
